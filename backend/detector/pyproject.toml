[project]
name = "detector"
version = "0.2.0"
description = "Scam detector: screen (ElevenLabs + openWakeWord) → STT/Grok → log/notify"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "numpy>=1.26.0",
  "pydub>=0.25.1",
]

[project.optional-dependencies]
# Linux + NVIDIA driver CUDA 12.4 (e.g. RTX 4070). Do not use default PyPI torch (cu130).
kws = [
  "torch==2.6.0",
  "transformers>=4.40.0",
]

[[tool.uv.index]]
name = "pytorch-cu124"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cu124" }


[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
