[project]
name = "detector"
version = "0.2.0"
description = "Scam detector: screen (ElevenLabs + openWakeWord) → STT/Grok → log/notify"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115.0",
  "uvicorn[standard]>=0.32.0",
  "httpx>=0.27.0",
  "pydantic-settings>=2.6.0",
  "python-multipart>=0.0.12",
  "python-dotenv>=1.0.0",
  "requests>=2.32.0",
  "sqlalchemy>=2.0.36",
  "psycopg[binary]>=3.2.0",
  "numpy>=1.26.0",
  "pydub>=0.25.1",
  "openwakeword>=0.6.0",
]

[project.optional-dependencies]
# Linux backend only — onnx/tflite wheels are unreliable on macOS 12.
kws = [
  "openwakeword>=0.6.0",
  "onnxruntime>=1.16.0",
]


[dependency-groups]
dev = [
  "pytest>=8.3.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
