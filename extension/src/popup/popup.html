<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>We Hate Scammers</title>
    <link rel="stylesheet" href="popup.css" />
  </head>
  <body>
    <header>
      <p class="eyebrow">We Hate Scammers</p>
      <h1>On-device flags</h1>
    </header>

    <section class="card">
      <label class="toggle">
        <input id="master" type="checkbox" />
        <span>Master enable</span>
      </label>
      <p class="hint">Off = zero observer work on every site.</p>
    </section>

    <section class="card">
      <h2>Sites</h2>
      <label class="toggle">
        <input id="site-linkedin" type="checkbox" data-site="linkedin" />
        <span>LinkedIn</span>
      </label>
      <label class="toggle">
        <input id="site-facebook" type="checkbox" data-site="facebook" />
        <span>Facebook / Messenger</span>
      </label>
      <label class="toggle">
        <input id="site-instagram" type="checkbox" data-site="instagram" />
        <span>Instagram</span>
      </label>
      <p class="hint">Fail open. A disabled site never attaches a scanner.</p>
    </section>

    <section class="card meta">
      <div>
        <span class="k">Rules</span>
        <strong id="rules-version">—</strong>
      </div>
      <div>
        <span class="k">Warnings shown</span>
        <strong id="warnings-shown">0</strong>
      </div>
    </section>

    <section class="actions">
      <button id="open-fixture" type="button">Open test fixture</button>
      <a id="privacy" href="../privacy.md" target="_blank" rel="noreferrer">Privacy</a>
    </section>

    <p id="status" class="status" hidden></p>
    <script type="module" src="popup.js"></script>
  </body>
</html>
