<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sherpa</title>
    <style>
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Regular.woff2") format("woff2");
        font-weight: 400;
        font-style: normal;
        font-display: swap;
      }
      @font-face {
        font-family: "JetBrains Mono";
        src: url("fonts/JetBrainsMono-Bold.woff2") format("woff2");
        font-weight: 700;
        font-style: normal;
        font-display: swap;
      }
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 280px;
        padding: 14px;
        background: #1e1f22;
        color: #dbdee1;
        font: 12.5px/1.45 "JetBrains Mono", ui-monospace, monospace;
      }
      header {
        margin-bottom: 12px;
      }
      h1 {
        margin: 0;
        font-size: 28px;
        font-weight: 700;
        letter-spacing: -0.04em;
        line-height: 1.1;
      }
      .status {
        padding: 8px 10px;
        border-radius: 8px;
        background: #2b2d31;
        margin-bottom: 12px;
      }
      .status strong {
        display: block;
        margin-bottom: 2px;
      }
      .status[data-ok="yes"] strong {
        color: #86efac;
      }
      .status[data-ok="maybe"] strong {
        color: #e2b422;
      }
      .status[data-ok="no"] strong {
        color: #e05a5a;
      }
      .pref {
        margin-bottom: 12px;
      }
      .pref-title {
        margin: 0 0 8px;
        font-weight: 700;
        font-size: 11px;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: #b5bac1;
      }
      .switch-row {
        display: flex;
        align-items: center;
        gap: 10px;
      }
      .switch-row span {
        font-weight: 700;
      }
      .switch {
        position: relative;
        width: 44px;
        height: 24px;
        padding: 0;
        border: 0;
        border-radius: 999px;
        background: #3f4147;
        cursor: pointer;
        flex: none;
      }
      .switch[aria-checked="true"] {
        background: #5865f2;
      }
      .switch .knob {
        position: absolute;
        top: 3px;
        left: 3px;
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: #fff;
        transition: transform 0.16s ease;
      }
      .switch[aria-checked="true"] .knob {
        transform: translateX(20px);
      }
      #agg-copy {
        margin: 8px 0 0;
        color: #b5bac1;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0;
        cursor: pointer;
      }
      .check input {
        margin-top: 3px;
        flex: none;
        accent-color: #5865f2;
      }
    </style>
  </head>
  <body>
    <header>
      <h1>Sherpa</h1>
    </header>
    <div class="status" id="status" data-ok="maybe">
      <strong id="status-title">Checking this tab…</strong>
      <span id="status-detail">See if Sherpa is injected here.</span>
    </div>
    <section class="pref">
      <p class="pref-title">Mode</p>
      <div class="switch-row">
        <span>Warn</span>
        <button type="button" class="switch" id="aggression" role="switch" aria-checked="false" aria-label="Block mode">
          <span class="knob"></span>
        </button>
        <span>Block</span>
      </div>
      <p id="agg-copy"></p>
    </section>
    <label class="check">
      <input id="descriptions" type="checkbox" checked />
      <span>Show descriptions on hover</span>
    </label>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
