<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Sherpa</title>
    <style>
      :root {
        color-scheme: dark;
      }
      body {
        margin: 0;
        width: 280px;
        padding: 12px;
        background: #1e1f22;
        color: #dbdee1;
        font: 13px/1.4 "gg sans", "Noto Sans", "Helvetica Neue", Helvetica, Arial, sans-serif;
      }
      header {
        display: flex;
        gap: 10px;
        align-items: center;
        margin-bottom: 10px;
      }
      header svg {
        width: 28px;
        height: 28px;
        border-radius: 7px;
        flex: none;
      }
      h1 {
        margin: 0;
        font-size: 15px;
      }
      .sub {
        margin: 2px 0 0;
        color: #b5bac1;
        font-size: 12px;
      }
      .status {
        padding: 8px 10px;
        border-radius: 8px;
        background: #2b2d31;
        margin-bottom: 10px;
      }
      .status strong {
        display: block;
        margin-bottom: 2px;
      }
      .status[data-ok="yes"] strong {
        color: #86efac;
      }
      .status[data-ok="maybe"] strong {
        color: #e2b422;
      }
      .status[data-ok="no"] strong {
        color: #e05a5a;
      }
      .pref {
        margin-bottom: 10px;
      }
      .pref-title {
        margin: 0 0 6px;
        font-weight: 700;
      }
      input[type="range"] {
        width: 100%;
        accent-color: #5865f2;
      }
      .ticks {
        display: flex;
        justify-content: space-between;
        margin-top: 2px;
        color: #b5bac1;
        font-size: 12px;
        font-weight: 600;
      }
      #agg-copy {
        margin: 6px 0 0;
        color: #b5bac1;
      }
      .check {
        display: flex;
        gap: 8px;
        align-items: flex-start;
        margin: 0;
        cursor: pointer;
      }
      .check input {
        margin-top: 2px;
        flex: none;
      }
    </style>
  </head>
  <body>
    <header>
      <svg viewBox="0 0 32 32" aria-hidden="true">
        <rect width="32" height="32" rx="8" fill="#1e1f22" />
        <rect x="5" y="9" width="22" height="6" rx="2" fill="#e2b422" />
        <rect x="5" y="17" width="22" height="6" rx="2" fill="#e05a5a" />
      </svg>
      <div>
        <h1>Sherpa</h1>
        <p class="sub">Offline check · nothing is sent away</p>
      </div>
    </header>
    <div class="status" id="status" data-ok="maybe">
      <strong id="status-title">Checking this tab…</strong>
      <span id="status-detail">See if Sherpa is injected here.</span>
    </div>
    <section class="pref">
      <p class="pref-title">Aggressiveness</p>
      <input id="aggression" type="range" min="0" max="1" step="1" value="0" />
      <div class="ticks"><span>Warn</span><span>Block</span></div>
      <p id="agg-copy"></p>
    </section>
    <label class="check">
      <input id="descriptions" type="checkbox" checked />
      <span>Show descriptions — hover a highlight for the reason</span>
    </label>
    <script src="settings.js"></script>
    <script src="popup.js"></script>
  </body>
</html>
